name: Daily content update

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check live sources
        run: npm run check:sources

      - name: Update Riot Data Dragon patch
        run: npm run update:ddragon

      - name: Validate
        run: |
          npm run lint
          npm run build

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/ddragon.ts .env.example
            git commit -m "chore: update riot live data"
            git push
          else
            echo "No Riot data changes detected."
          fi
